<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batik Vision | Fine-Grained Pattern Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-pattern"></div>
    
    <main class="container">
        <header>
            <div class="logo">Batik Vision</div>
            <h1>Discover the Heritage</h1>
            <p class="subtitle">Fine-grained visual search for Indonesian textile patterns.</p>
        </header>

        <section class="upload-section" id="upload-area">
            <div class="upload-box">
                <div class="icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <h3>Upload Batik Image</h3>
                <p>Drag & drop or click to browse</p>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>
            <div id="preview-container" class="preview-container hidden">
                <img id="preview-image" src="" alt="Query Preview">
                <button id="clear-btn" class="close-btn">&times;</button>
            </div>
        </section>

        <section class="results-section">
            <div class="section-header">
                <h2>Top Matches</h2>
                <div class="loader hidden" id="loader"></div>
            </div>
            <div class="grid" id="results-grid">
                <!-- Results injected here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
